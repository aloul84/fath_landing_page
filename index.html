<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="128x128" href="./fath-logo-white.png">

    <title>فَذ - Coming Soon</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:wght@400;700;900&family=Cairo:wght@300;400;600;700;900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4BAC94;
            --secondary-color: #1F2F53;
            --gradient-1: linear-gradient(135deg, #1F2F53 0%, #2a4165 25%, #4BAC94 75%, #5bc4a8 100%);
            --gradient-2: linear-gradient(45deg, #4BAC94, #5bc4a8, #6dd4b8);
        }

        body {
            font-family: 'Cairo', 'Amiri', serif;
            background: #0a0e1a;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated gradient background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0a0e1a 0%, #1F2F53 25%, #2a4165 50%, #1F2F53 75%, #0a0e1a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Enhanced animated particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, var(--primary-color) 0%, rgba(75, 172, 148, 0.3) 40%, transparent 70%);
            border-radius: 50%;
            animation: floatParticle 25s infinite linear;
            filter: blur(1px);
        }

        .particle:nth-child(1) { width: 8px; height: 8px; left: 5%; animation-delay: 0s; animation-duration: 28s; }
        .particle:nth-child(2) { width: 12px; height: 12px; left: 15%; animation-delay: 3s; animation-duration: 35s; }
        .particle:nth-child(3) { width: 6px; height: 6px; left: 25%; animation-delay: 6s; animation-duration: 30s; }
        .particle:nth-child(4) { width: 10px; height: 10px; left: 35%; animation-delay: 9s; animation-duration: 40s; }
        .particle:nth-child(5) { width: 7px; height: 7px; left: 45%; animation-delay: 12s; animation-duration: 33s; }
        .particle:nth-child(6) { width: 9px; height: 9px; left: 55%; animation-delay: 15s; animation-duration: 38s; }
        .particle:nth-child(7) { width: 11px; height: 11px; left: 65%; animation-delay: 18s; animation-duration: 42s; }
        .particle:nth-child(8) { width: 5px; height: 5px; left: 75%; animation-delay: 21s; animation-duration: 29s; }
        .particle:nth-child(9) { width: 8px; height: 8px; left: 85%; animation-delay: 24s; animation-duration: 36s; }
        .particle:nth-child(10) { width: 6px; height: 6px; left: 10%; animation-delay: 27s; animation-duration: 31s; }
        .particle:nth-child(11) { width: 10px; height: 10px; left: 30%; animation-delay: 30s; animation-duration: 37s; }
        .particle:nth-child(12) { width: 7px; height: 7px; left: 50%; animation-delay: 33s; animation-duration: 34s; }
        .particle:nth-child(13) { width: 9px; height: 9px; left: 70%; animation-delay: 36s; animation-duration: 32s; }
        .particle:nth-child(14) { width: 8px; height: 8px; left: 90%; animation-delay: 39s; animation-duration: 35s; }
        .particle:nth-child(15) { width: 11px; height: 11px; left: 20%; animation-delay: 42s; animation-duration: 41s; }

        @keyframes floatParticle {
            0% {
                transform: translateY(120vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Glowing orbs with movement */
        .floating-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            animation: orbMove 20s infinite ease-in-out;
            opacity: 0.4;
        }

        .orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--primary-color), transparent);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .orb:nth-child(2) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #5bc4a8, transparent);
            top: 60%;
            right: 15%;
            animation-delay: 5s;
        }

        .orb:nth-child(3) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--primary-color), transparent);
            bottom: 10%;
            left: 20%;
            animation-delay: 10s;
        }

        .orb:nth-child(4) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #6dd4b8, transparent);
            top: 40%;
            left: 50%;
            animation-delay: 15s;
        }

        @keyframes orbMove {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(50px, -30px) scale(1.1);
            }
            50% {
                transform: translate(-30px, 40px) scale(0.9);
            }
            75% {
                transform: translate(40px, 20px) scale(1.05);
            }
        }

        /* Geometric shapes with enhanced animation */
        .geometric-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            opacity: 0.15;
            animation: shapeFloat 25s infinite ease-in-out;
        }

        .shape.triangle {
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 50px solid var(--primary-color);
        }

        .shape.circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-color);
        }

        .shape.square {
            width: 35px;
            height: 35px;
            background: var(--primary-color);
            transform: rotate(45deg);
        }

        .shape:nth-child(1) { top: 15%; left: 8%; animation-delay: 0s; }
        .shape:nth-child(2) { top: 65%; left: 85%; animation-delay: 8s; }
        .shape:nth-child(3) { top: 80%; left: 15%; animation-delay: 16s; }
        .shape:nth-child(4) { top: 25%; left: 75%; animation-delay: 24s; }
        .shape:nth-child(5) { top: 45%; left: 5%; animation-delay: 12s; }
        .shape:nth-child(6) { top: 55%; right: 10%; animation-delay: 20s; }

        @keyframes shapeFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0.15;
            }
            25% {
                transform: translateY(-40px) rotate(90deg) scale(1.3);
                opacity: 0.25;
            }
            50% {
                transform: translateY(-20px) rotate(180deg) scale(1.1);
                opacity: 0.3;
            }
            75% {
                transform: translateY(-50px) rotate(270deg) scale(1.2);
                opacity: 0.2;
            }
        }

        /* Sparkles effect */
        .sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: sparkleAnim 3s infinite ease-in-out;
            box-shadow: 0 0 10px var(--primary-color);
        }

        .sparkle:nth-child(odd) { animation-delay: 0s; }
        .sparkle:nth-child(even) { animation-delay: 1.5s; }

        @keyframes sparkleAnim {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        .container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            text-align: center;
        }

        /* Enhanced logo with 3D effect */
        .logo-container {
            margin-bottom: 1.5rem;
            animation: logoFloat 6s ease-in-out infinite;
            position: relative;
            filter: drop-shadow(0 0 40px rgba(75, 172, 148, 0.6));
        }

        .logo {
            width: 180px;
            height: 180px;
            background-image: url("./fath-logo-white.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 60px rgba(75, 172, 148, 0.5),
                0 0 100px rgba(75, 172, 148, 0.3),
                inset 0 0 40px rgba(75, 172, 148, 0.2);
            animation: logoRotate 20s linear infinite, logoPulse 3s ease-in-out infinite;
        }

        .logo::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--primary-color), transparent, var(--primary-color), transparent);
            animation: logoShine 4s linear infinite;
            opacity: 0.3;
        }

        .logo::after {
            content: '';
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1));
            animation: logoGleam 6s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes logoRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes logoShine {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes logoGleam {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* Main text with gradient animation */
        .main-text {
            font-size: 4.5rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--primary-color), #5bc4a8, #6dd4b8, var(--primary-color));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textGradient 3s linear infinite, textFloat 4s ease-in-out infinite;
            font-family: 'Cairo', 'Amiri', serif;
            letter-spacing: 0.2em;
            filter: drop-shadow(0 0 30px rgba(75, 172, 148, 0.7));
            position: relative;
        }

        .main-text::before {
            content: 'فَذ';
            position: absolute;
            left: 0;
            top: 0;
            z-index: -1;
            background: linear-gradient(90deg, var(--primary-color), #5bc4a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(20px);
            opacity: 0.5;
            animation: textGlow 2s ease-in-out infinite;
        }

        @keyframes textGradient {
            to { background-position: 200% center; }
        }

        @keyframes textFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes textGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .subtitle {
            font-size: 1.6rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 1.5rem;
            font-family: 'Cairo', serif;
            font-weight: 400;
            letter-spacing: 0.1em;
            animation: fadeInUp 1.5s ease-out 0.3s both, subtitleGlow 3s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(75, 172, 148, 0.5);
        }

        @keyframes subtitleGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(75, 172, 148, 0.5); }
            50% { text-shadow: 0 0 30px rgba(75, 172, 148, 0.8); }
        }

        .coming-soon {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2rem;
            font-family: 'Cairo', serif;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            animation: fadeInUp 1.5s ease-out 0.6s both;
            position: relative;
            padding-bottom: 1rem;
        }

        .coming-soon::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            animation: lineExpand 2s ease-in-out infinite;
            box-shadow: 0 0 10px var(--primary-color);
        }

        @keyframes lineExpand {
            0%, 100% { width: 100px; opacity: 0.5; }
            50% { width: 150px; opacity: 1; }
        }

        /* Contest button with fancy animation */
        .contest-btn {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, var(--primary-color), #5bc4a8, #6dd4b8);
            background-size: 200% auto;
            color: var(--secondary-color);
            text-decoration: none;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            box-shadow: 
                0 0 30px rgba(75, 172, 148, 0.5),
                0 10px 40px rgba(75, 172, 148, 0.3);
            transition: all 0.4s ease;
            animation: fadeInUp 1.5s ease-out 0.9s both, btnPulse 2s infinite alternate;
            border: 2px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .contest-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: btnShine 3s infinite;
        }

        .contest-btn:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 
                0 0 50px rgba(75, 172, 148, 0.8),
                0 20px 60px rgba(75, 172, 148, 0.5);
            background-position: right center;
        }

        @keyframes btnPulse {
            0% { box-shadow: 0 0 30px rgba(75, 172, 148, 0.5), 0 10px 40px rgba(75, 172, 148, 0.3); }
            100% { box-shadow: 0 0 50px rgba(75, 172, 148, 0.7), 0 15px 50px rgba(75, 172, 148, 0.5); }
        }

        @keyframes btnShine {
            0% { left: -100%; }
            50%, 100% { left: 200%; }
        }

        /* Social links with hover effects */
        .social-links {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            animation: fadeInUp 1.5s ease-out 1.2s both;
        }

        .social-link {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(75, 172, 148, 0.15);
            color: var(--primary-color);
            font-size: 1.3rem;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(75, 172, 148, 0.3);
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--gradient-2);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .social-link i {
            position: relative;
            z-index: 1;
        }

        .social-link:hover {
            transform: translateY(-10px) rotate(360deg);
            box-shadow: 0 10px 30px rgba(75, 172, 148, 0.5);
            border-color: var(--primary-color);
        }

        .social-link:hover::before {
            opacity: 1;
        }

        .social-link:hover i {
            color: var(--secondary-color);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-text { font-size: 3rem; }
            .logo { width: 140px; height: 140px; }
            .subtitle { font-size: 1.3rem; }
            .coming-soon { font-size: 1.6rem; }
            .contest-btn { font-size: 1.1rem; padding: 0.9rem 2rem; }
            .social-link { width: 48px; height: 48px; font-size: 1.1rem; }
        }

        @media (max-width: 480px) {
            .main-text { font-size: 2.5rem; margin-bottom: 0.8rem; }
            .logo { width: 120px; height: 120px; }
            .subtitle { font-size: 1.1rem; margin-bottom: 1.2rem; }
            .coming-soon { font-size: 1.4rem; margin-bottom: 1.5rem; }
            .contest-btn { font-size: 1rem; padding: 0.8rem 1.8rem; margin-bottom: 1.5rem; }
            .social-links { gap: 0.8rem; margin-top: 0.8rem; }
            .social-link { width: 45px; height: 45px; font-size: 1rem; }
            .container { padding: 1rem; }
            .logo-container { margin-bottom: 1.2rem; }
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Selection styling */
        ::selection {
            background: var(--primary-color);
            color: var(--secondary-color);
        }

        ::-moz-selection {
            background: var(--primary-color);
            color: var(--secondary-color);
        }

        /* Loading animation for page */
        @keyframes pageLoad {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body {
            animation: pageLoad 1s ease-out;
        }
    </style>
</head>

<body>
    <div class="animated-bg"></div>

    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="geometric-shapes">
        <div class="shape triangle"></div>
        <div class="shape circle"></div>
        <div class="shape square"></div>
        <div class="shape triangle"></div>
        <div class="shape circle"></div>
        <div class="shape square"></div>
    </div>

    <div class="floating-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="sparkles">
        <div class="sparkle" style="top: 20%; left: 15%;"></div>
        <div class="sparkle" style="top: 40%; left: 80%;"></div>
        <div class="sparkle" style="top: 60%; left: 10%;"></div>
        <div class="sparkle" style="top: 80%; left: 70%;"></div>
        <div class="sparkle" style="top: 30%; left: 50%;"></div>
        <div class="sparkle" style="top: 70%; left: 40%;"></div>
    </div>

    <div class="container">
        <div class="logo-container">
            <div class="logo"></div>
        </div>

        <h1 class="main-text">فَذ</h1>

        <p class="subtitle">شيء استثنائي قادم</p>

        <h2 class="coming-soon">Coming Soon</h2>

        <a href="https://register.fath-app.com/" class="contest-btn">
            <i class="fas fa-moon" style="margin-left: 10px;"></i>
            التسجيل في المسابقة الرمضانية
        </a>

        <div class="social-links">
            <a href="https://www.instagram.com/thefathapp/" class="social-link" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://www.facebook.com/thefathapp" class="social-link" target="_blank">
                <i class="fab fa-facebook-f"></i>
            </a>
        </div>
    </div>

</body>

</html>
